<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <title>Redirigiendo…</title>
    <script>
      (function () {
        var base = '/portafolio_fbarraza/';
        var l = window.location;
        var path = l.pathname.startsWith(base)
          ? l.pathname.slice(base.length)
          : l.pathname.replace(/^\/+/, '');
        var target =
          base +
          '?p=' +
          encodeURIComponent('/' + path) +
          (l.search ? '&q=' + encodeURIComponent(l.search.slice(1)) : '') +
          l.hash;
        l.replace(target);
      })();
    </script>
  </head>
  <body></body>
</html>
